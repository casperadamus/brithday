<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wszystkiego najlepszego, Mamo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&family=Caveat:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>" />
</head>
<body>
  <div class="petals" aria-hidden="true"></div>

  <header class="hero">
    <p class="eyebrow reveal">mały prezent dla Ciebie</p>
    <h1 class="reveal">
      <span class="h1-small">Wszystkiego najlepszego,</span>
      <span class="h1-name" data-bind="momName">Mamo</span>
    </h1>
    <p class="tagline reveal" data-bind="tagline"></p>
    <a class="scroll-cue reveal" href="#letter" aria-label="Przewiń w dół">
      <span></span>
    </a>
  </header>

  <main>
    <section id="letter" class="letter">
      <div class="paper reveal">
        <p class="salutation">Kochana <span data-bind="momName"></span>,</p>
        <div class="letter-body"></div>
        <p class="signoff">
          Z całego serca,<br />
          <span class="signature" data-bind="fromName"></span>
        </p>
      </div>
    </section>

    <section class="gallery-section">
      <div class="section-head reveal">
        <p class="eyebrow">wspomnienia</p>
        <h2>Ty i ja</h2>
      </div>
      <div class="gallery"></div>
    </section>

    <section class="reasons-section">
      <div class="section-head reveal">
        <p class="eyebrow">krótka lista</p>
        <h2>Za co Cię kocham</h2>
      </div>
      <ol class="reasons"></ol>
    </section>

    <section class="finale">
      <h2 class="reveal">Jeszcze jedno…</h2>
      <button class="gift reveal" type="button">Otwórz mnie</button>
      <p class="surprise" data-bind="surprise" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <p>zrobione z miłością, tylko dla Ciebie ♡</p>
  </footer>

  <div class="lightbox" hidden>
    <button class="lightbox-close" type="button" aria-label="Zamknij">×</button>
    <figure>
      <img alt="" />
      <figcaption></figcaption>
    </figure>
  </div>

  <canvas class="confetti" aria-hidden="true"></canvas>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
